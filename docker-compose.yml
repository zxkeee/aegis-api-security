services:
  # ── API Security Gateway ─────────────────────────────────────────────────────
  # Required env vars (copy .env.example → .env and fill in values):
  #   AEGIS_ADMIN_SECRET, AEGIS_REDIS_PASSWORD, AEGIS_JWT_SECRET (if auth.enabled)
  gateway:
    build: .
    ports:
      - "8080:8080"                 # Gateway proxy — safe to expose
      # Admin API is bound to localhost only. The admin plane must never face the
      # public internet (see §8 "Securing AEGIS Itself"); expose it via a VPN,
      # SSH tunnel, or an authenticated ingress instead of publishing 8081.
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - AEGIS_ADMIN_SECRET=${AEGIS_ADMIN_SECRET}
      - AEGIS_REDIS_PASSWORD=${AEGIS_REDIS_PASSWORD}
      - AEGIS_JWT_SECRET=${AEGIS_JWT_SECRET:-}
      # Default the forensic/catalog/iam/audit DSN to the bundled PostgreSQL so
      # discovery, multi-tenancy, the audit log, SSO and retention work out of the
      # box. Override AEGIS_FORENSIC_DSN to point at an external database.
      - AEGIS_FORENSIC_DSN=${AEGIS_FORENSIC_DSN:-postgres://aegis:${POSTGRES_PASSWORD:-aegis}@postgres:5432/aegis?sslmode=disable}
      - AEGIS_OIDC_CLIENT_ID=${AEGIS_OIDC_CLIENT_ID:-}
      - AEGIS_OIDC_CLIENT_SECRET=${AEGIS_OIDC_CLIENT_SECRET:-}
    restart: unless-stopped
    networks:
      - aegis

  # ── Redis (State Store) ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Redis port is NOT exposed to the host — only reachable inside the aegis network.
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${AEGIS_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AEGIS_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aegis

  # ── PostgreSQL (durable catalog, forensics, IAM, audit) ──────────────────────
  # Not exposed to the host — only reachable inside the aegis network. Enables the
  # discovery catalog, multi-tenancy, admin audit log, OIDC SSO and retention.
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=aegis
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aegis

  # ── Prometheus (Metrics Collection) ──────────────────────────────────────────
  # Prometheus is NOT exposed to the host — access via Grafana or kubectl port-forward.
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - aegis

  # ── Grafana (Dashboards) ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "127.0.0.1:3000:3000"   # localhost only — do not expose publicly
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - aegis

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  aegis:
    driver: bridge
